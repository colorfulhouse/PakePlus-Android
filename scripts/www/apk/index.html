<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="途观驾驶" />

<title>大众途观模拟驾驶 · 城堡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  .speed-text {
    position: absolute; top: 30px; right: 40px;
    color: #fff; font-size: 80px; font-weight: bold;
    text-shadow: 0 0 12px rgba(0,0,0,0.9);
    z-index: 20; pointer-events: none;
  }
  .btn-group {
    position: absolute; left: 24px; bottom: 24px; z-index: 30;
    display: flex; gap: 12px;
  }
  .btn-group button {
    padding: 10px 22px; font-size: 20px; border: none;
    border-radius: 10px; background: rgba(0,120,255,0.9);
    color: #fff; cursor: pointer;
  }
  .btn-group button:hover { background: rgba(0,120,255,1); }
</style>
</head>

  <button onclick="toggleFullscreen()">全屏</button>
</div>

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("图片加载失败: " + url));
    img.src = url;
  });
}

Promise.all([
  loadImage(bgFileName),
  loadImage(carFileName),
  loadImage(wheelFileName)
]).then(([bgImg, carImg, wheelImg]) => {
  bgImage = bgImg;
  carBodyImage = carImg;
  wheelImage = wheelImg;
  startRender();
}).catch(err => {
  console.error(err);
  alert("资源加载失败");
});

function startRender() {
  function resize() {
    // 手机等高分屏按 DPR 放大画布（最多 2x），宽屏车机保持 1x 省性能
    const baseW = window.innerWidth;
    const dpr = baseW > 1400 ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(baseW * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }

  resize();
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () {
    setTimeout(resize, 300);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawRoad();
    drawCar();
    updatePhysics();
    requestAnimationFrame(render);
  }
  render();
}

// ─── 背景：镜像拼接实现无缝横向滚动 ───
function drawBackground() {
  if (!bgImage) return;

  const imgH = canvas.height;
  const imgW = bgImage.width * (imgH / bgImage.height);
  const period = imgW * 2;              // 原图 + 镜像 = 一个周期

  const phase = ((bgOffset % period) + period) % period;

  const startIdx = Math.floor(-phase / imgW) - 1;
  const count = Math.ceil(canvas.width / imgW) + 3;

  for (let i = 0; i < count; i++) {
    const idx = startIdx + i;
    const x = idx * imgW + phase;
    const mirrored = (((idx % 2) + 2) % 2) === 1;

    if (mirrored) {
      ctx.save();
      ctx.translate(x + imgW, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(bgImage, 0, 0, imgW, imgH);
      ctx.restore();
    } else {
      ctx.drawImage(bgImage, x, 0, imgW, imgH);
    }
  }
}

// ─── 路面与车道线（叠在背景底部） ───
function drawRoad() {
  const groundY = canvas.height * 0.85;

  ctx.fillStyle = "rgba(28, 30, 34, 0.62)";
  ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

  ctx.fillStyle = "rgba(245, 245, 220, 0.55)";
  ctx.fillRect(0, groundY, canvas.width, 3);

  ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
  ctx.lineWidth = 3;
  ctx.setLineDash([40, 30]);
  ctx.lineDashOffset = -bgOffset * 0.8;
  ctx.beginPath();
  ctx.moveTo(0, groundY + (canvas.height - groundY) * 0.5);
  ctx.lineTo(canvas.width, groundY + (canvas.height - groundY) * 0.5);
  ctx.stroke();
  ctx.setLineDash([]);
}

// ─── 绘制车辆（位图车身 + 可旋转轮子） ───
function drawCar() {
  if (!carBodyImage) return;

  const W = canvas.width;
  const H = canvas.height;
  const groundY = H * 0.85;

  const bounce = speed > 0 ? Math.sin(time * 8) * 1.0 : 0;

  // 车身尺寸（tiguan_car.png 为 2000 x 734）
  let carH = H * 0.28;
  let carW = carH * (carBodyImage.width / carBodyImage.height);
  const maxW = W * 0.8;
  if (carW > maxW) {
    carW = maxW;
    carH = carW * (carBodyImage.height / carBodyImage.width);
  }

  // 轮子在车身图中的相对位置（矢量化脚本实测）
  const LEFT_X = 0.1892;
  const RIGHT_X = 0.7955;
  const WHEEL_Y = 0.780;
  const WHEEL_R_RATIO = 0.1809;

  const carX = W / 2 - carW / 2;
  const carY = groundY - carH * (WHEEL_Y + WHEEL_R_RATIO) + bounce;

  // 车底阴影
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(W / 2, groundY + 4, carW * 0.46, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.drawImage(carBodyImage, carX, carY, carW, carH);

  const wr = carH * WHEEL_R_RATIO;
  drawRotatedWheel(carX + carW * LEFT_X, carY + carH * WHEEL_Y, wr, wheelAngle);
  drawRotatedWheel(carX + carW * RIGHT_X, carY + carH * WHEEL_Y, wr, wheelAngle);
}

// ─── 绘制旋转轮子 ───
function drawRotatedWheel(x, y, r, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.drawImage(wheelImage, -r, -r, r * 2, r * 2);
  ctx.restore();
}

// ─── 物理更新 ───
function updatePhysics() {
  if (speed <= 0) return;
  time += 0.016;
  bgOffset += speed * 0.5;
  wheelAngle += speed * 0.008;
}

function updateUI() {
  speedText.textContent = speed + " km/h";
}

function changeSpeed(delta) {
  speed += delta;
  if (speed < 0) speed = 0;
  if (speed > MAX_SPEED) speed = MAX_SPEED;
  updateUI();
}

function setSpeed(val) {
  speed = val;
  updateUI();
}

// 全屏切换（兼容安卓车机 WebView；iOS Safari 不支持页面全屏，需添加到主屏幕）
function toggleFullscreen() {
  const el = document.documentElement;
  const isFull = document.fullscreenElement || document.webkitFullscreenElement;
  if (!isFull) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el);
    } else {
      alert("当前浏览器不支持网页全屏。\niPhone / iPad：点 Safari 底部的「分享」按钮 →「添加到主屏幕」，之后从桌面图标打开即可全屏运行。\n安卓车机：点浏览器菜单里的「全屏」或「沉浸模式」。");
    }
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
}
